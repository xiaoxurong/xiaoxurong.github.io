<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
 <title id="title">Sparse representation fine-tuning</title><desc id="desc">A frozen transformer block produces a hidden representation. The original representation follows a residual connection, and a sparse trainable operator contributes an additive edit before the next frozen block.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#596c61" stroke-width="1.4"/></marker></defs>
 <g font-family="Arial, sans-serif" fill="#293c33">
  <text x="40" y="42" font-size="12" letter-spacing="1.7" fill="#6c7970">FROZEN BACKBONE</text>
  <rect x="40" y="74" width="164" height="66" rx="6" fill="#e6ece3" stroke="#c5d0c0"/>
  <text x="122" y="102" text-anchor="middle" font-size="15">Transformer block</text><text x="122" y="122" text-anchor="middle" font-size="11" fill="#677769">weights frozen</text>
  <path d="M204 107H440" fill="none" stroke="#596c61" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="278" y="87" text-anchor="middle" font-size="12" fill="#66776a">hidden state h</text>
  <circle cx="270" cy="107" r="3.5" fill="#596c61"/>
  <circle cx="461" cy="107" r="20" fill="#fffefa" stroke="#596c61" stroke-width="1.7"/>
  <path d="M453 107H469M461 99V115" stroke="#596c61" stroke-width="1.7"/>
  <path d="M481 107H526" fill="none" stroke="#596c61" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="74" width="140" height="66" rx="6" fill="#e6ece3" stroke="#c5d0c0"/>
  <text x="610" y="102" text-anchor="middle" font-size="15">Next block</text><text x="610" y="122" text-anchor="middle" font-size="11" fill="#677769">weights frozen</text>
  <path d="M270 107V235H298" fill="none" stroke="#9c4934" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="178" width="126" height="118" rx="7" fill="#f4e9e1" stroke="#d9b5a3"/>
  <g fill="#e4d3c6">
   <rect x="333" y="196" width="16" height="16" rx="2"/><rect x="355" y="196" width="16" height="16" rx="2"/><rect x="377" y="196" width="16" height="16" rx="2"/><rect x="399" y="196" width="16" height="16" rx="2"/>
   <rect x="333" y="218" width="16" height="16" rx="2"/><rect x="355" y="218" width="16" height="16" rx="2"/><rect x="377" y="218" width="16" height="16" rx="2"/><rect x="399" y="218" width="16" height="16" rx="2"/>
   <rect x="333" y="240" width="16" height="16" rx="2"/><rect x="355" y="240" width="16" height="16" rx="2"/><rect x="377" y="240" width="16" height="16" rx="2"/><rect x="399" y="240" width="16" height="16" rx="2"/>
   <rect x="333" y="262" width="16" height="16" rx="2"/><rect x="355" y="262" width="16" height="16" rx="2"/><rect x="377" y="262" width="16" height="16" rx="2"/><rect x="399" y="262" width="16" height="16" rx="2"/>
  </g>
  <g fill="#a55037"><rect x="355" y="196" width="16" height="16" rx="2"/><rect x="399" y="218" width="16" height="16" rx="2"/><rect x="333" y="240" width="16" height="16" rx="2"/><rect x="377" y="262" width="16" height="16" rx="2"/></g>
  <path d="M436 235H461V132" fill="none" stroke="#9c4934" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="211" font-size="12" fill="#9c4934">additive edit</text>
  <text x="373" y="321" text-anchor="middle" font-size="14" fill="#88442f">Sparse mixing operator</text>
  <text x="373" y="343" text-anchor="middle" font-size="11" fill="#766f64">Randomly select support; train selected values</text>
  <circle cx="260" cy="374" r="4" fill="#a55037"/><text x="271" y="378" font-size="10" fill="#766f64">trainable entries</text><circle cx="397" cy="374" r="4" fill="#c0c9b8"/><text x="408" y="378" font-size="10" fill="#766f64">frozen backbone</text>
 </g>
</svg>
